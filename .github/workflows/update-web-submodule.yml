name: Update Client submodule

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Update client submodule
        run: git submodule update --remote VaurenithClient
      - uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: VaurenithClient
          branch: automation/update-client-submodule
          delete-branch: true
          title: "chore: update VaurenithClient submodule"
          commit-message: "chore: update VaurenithClient submodule"
          body: "Updates VaurenithClient to the latest commit on its main branch."
