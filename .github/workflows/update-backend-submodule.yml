name: Update Backend submodule

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Update Backend submodule
        run: git submodule update --remote VaurenithBackend
      - uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: VaurenithBackend
          branch: automation/update-backend-submodule
          delete-branch: true
          title: "chore: update VaurenithBackend submodule"
          commit-message: "chore: update VaurenithBackend submodule"
          body: "Updates VaurenithBackend to the latest commit on its main branch."
